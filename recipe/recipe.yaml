schema_version: 1

context:
  name: colorlog
  version: "6.12.0"

package:
  name: colorlog
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/colorlog-${{ version }}.tar.gz
  sha256: 2a7924c1dadf18b22a0eb8b06d1c7b01d5341707ec1641eb6fcc4fde0c3e8e5f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=38.6.0
    - if: win
      then: colorama
  run:
    - python >=${{ python_min }}
    - if: unix
      then: __unix
    - if: win
      then:
        - __win
        - colorama
tests:
  - python:
      imports:
        - colorlog
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Log formatting with colors!
  homepage: https://github.com/borntyping/python-colorlog

extra:
  recipe-maintainers:
    - xylar
    - frol
    - forrestwaters
